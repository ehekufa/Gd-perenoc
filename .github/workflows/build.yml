name: build

permissions:
  contents: write

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Linux desktop build + level verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake gcc \
            libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --verbose

      - name: Verify that the level is beatable (autopilot replay)
        run: ctest --test-dir build --output-on-failure

      - name: Render a gameplay screenshot
        run: |
          mkdir -p screenshots
          ./build/point_of_no_return --screenshot screenshots/gameplay.bmp --shot-time 9000
          ./build/point_of_no_return --screenshot screenshots/finish.bmp --shot-time 64000

      - uses: actions/upload-artifact@v4
        with:
          name: point-of-no-return-linux
          path: build/point_of_no_return

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" \
                            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch SDL3 sources
        run: scripts/fetch_sdl.sh

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Show the APKs
        run: find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      # Boot a real Android 14 image, install the APK, start it and check that
      # it stays alive. This is the only way to know it does not crash on a
      # phone. Note: every line of `script` is executed as its own shell
      # command, so no multi-line if/then here.
      - name: Run the APK on an Android 14 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p emulator
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.ehekufa.pointofnoreturn/org.libsdl.app.SDLActivity
            sleep 25
            adb shell pidof com.ehekufa.pointofnoreturn > emulator/pid.txt || true
            adb logcat -d -v time > emulator/logcat.txt || true
            adb exec-out screencap -p > emulator/screen.png || true
            cat emulator/pid.txt
            grep -iE "pointofnoreturn|SDL|AndroidRuntime|FATAL|Exception" emulator/logcat.txt | tail -n 100 || true
            test -s emulator/pid.txt
            ! grep -q "FATAL EXCEPTION\|Couldn't find function SDL_main" emulator/logcat.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-log
          path: emulator/
          if-no-files-found: warn

      # Workflow logs and artifacts are not reachable from every environment,
      # so the relevant part of logcat is pushed to a small `ci-logs` branch
      # where it can simply be fetched.
      - name: Publish the emulator log to the ci-logs branch
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/ci
          printf 'run %s, commit %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/ci/emulator-log.txt
          echo "--- app pid ---" >> /tmp/ci/emulator-log.txt
          cat emulator/pid.txt >> /tmp/ci/emulator-log.txt 2>/dev/null || echo "(no pid: the app died)" >> /tmp/ci/emulator-log.txt
          echo "--- logcat ---" >> /tmp/ci/emulator-log.txt
          grep -iE "pointofnoreturn|SDL|AndroidRuntime|FATAL|Exception" emulator/logcat.txt 2>/dev/null | tail -n 200 >> /tmp/ci/emulator-log.txt
          cd /tmp/ci
          git init -q .
          git add emulator-log.txt
          git -c user.email=ci@users.noreply.github.com -c user.name=ci commit -qm "emulator log"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: point-of-no-return-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # so the APK can be downloaded without a GitHub login
      - name: Publish the APK as a release
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest \
              --title "Point of No Return — APK" \
              --notes "Свежая сборка APK из ветки $GITHUB_REF_NAME (коммит $GITHUB_SHA)."
          gh release upload apk-latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release.apk --clobber

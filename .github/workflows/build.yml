name: build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Linux desktop build + level verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake gcc \
            libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --verbose

      - name: Verify that the level is beatable (autopilot replay)
        run: ctest --test-dir build --output-on-failure

      - name: Render a gameplay screenshot
        run: |
          mkdir -p screenshots
          ./build/point_of_no_return --screenshot screenshots/gameplay.bmp --shot-time 5200
          ./build/point_of_no_return --screenshot screenshots/finish.bmp --shot-time 21500

      - uses: actions/upload-artifact@v4
        with:
          name: point-of-no-return-linux
          path: build/point_of_no_return

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages and NDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Fetch SDL3 sources
        run: scripts/fetch_sdl.sh

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Show the APKs
        run: find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: point-of-no-return-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

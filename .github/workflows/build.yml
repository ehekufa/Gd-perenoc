name: build

permissions:
  contents: write

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Linux desktop build + level verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake gcc \
            libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --verbose

      - name: Verify that the level is beatable (autopilot replay)
        run: ctest --test-dir build --output-on-failure

      - name: Render a gameplay screenshot
        run: |
          mkdir -p screenshots
          ./build/point_of_no_return --screenshot screenshots/gameplay.bmp --shot-time 9000
          ./build/point_of_no_return --screenshot screenshots/finish.bmp --shot-time 64000

      - uses: actions/upload-artifact@v4
        with:
          name: point-of-no-return-linux
          path: build/point_of_no_return

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" \
                            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch SDL3 sources
        run: scripts/fetch_sdl.sh

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Show the APKs
        run: find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      # Boot a real Android 14 image, install the APK, start it and check that
      # the process is alive and logcat has no fatal exception. This is the
      # only way to know the app does not crash on a phone.
      - name: Run the APK on an Android 14 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.ehekufa.pointofnoreturn/org.libsdl.app.SDLActivity
            sleep 20
            mkdir -p emulator
            adb shell pidof com.ehekufa.pointofnoreturn > emulator/pid.txt || true
            adb logcat -d -v time > emulator/logcat.txt || true
            adb exec-out screencap -p > emulator/screen.png || true
            echo "--- pid ---"; cat emulator/pid.txt
            echo "--- app log ---"
            grep -iE "pointofnoreturn|SDL|DEBUG|AndroidRuntime|FATAL" emulator/logcat.txt | tail -n 120 || true
            if grep -q "FATAL EXCEPTION" emulator/logcat.txt; then
              echo "::error::the app crashed, see the logcat artifact"
              exit 1
            fi
            test -s emulator/pid.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-log
          path: emulator/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: point-of-no-return-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # so the APK can be downloaded without a GitHub login
      - name: Publish the APK as a release
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest \
              --title "Point of No Return — APK" \
              --notes "Свежая сборка APK из ветки $GITHUB_REF_NAME (коммит $GITHUB_SHA)."
          gh release upload apk-latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release.apk --clobber
